[project]
name = "bilibili-connect"
version = "1.0.0"
description = "B 站互联，拥有访问 B 站能力"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2,<51",
    "curl-cffi>=0.16.0,<0.17",
    "google-re2>=1.1.20251105,<2",
    "httpx>=0.28.1,<0.29",
    "mcp==1.28.1",
    "msgpack>=1.1.1,<2",
    "pydantic>=2.12.5,<3",
    "pillow>=12.1.0,<13",
    "qrcode[pil]>=8.2,<9",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.51,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2",
    "ruff>=0.14.14,<0.15",
    "types-qrcode>=8.2,<9",
]

[project.scripts]
bilibili-connect = "fxbilibili_mcp.server:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxbilibili_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fxbilibili_mcp"]
mypy_path = "src"

[project.urls]
Repository = "https://git.ruinet.work/crop/BiliMCP"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml",
    "/uv.lock", "/Dockerfile", "/compose.yaml", "/.env.example",
    "/.gitignore", "/.dockerignore", "/.python-version",
]
